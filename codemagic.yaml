workflows:
  ios-app-store:
    name: iOS App Store
    max_build_duration: 60
    environment:
      xcode: latest
      node: v20
      # --- Secrets group ---
      # Create a group called "traverse-secrets" in Codemagic dashboard:
      # Teams → Environment variables → Create group
      # Add every key from .env.example, plus the three App Store Connect keys below.
      #
      # New keys required for native auth:
      #   GOOGLE_REVERSED_CLIENT_ID  → e.g. com.googleusercontent.apps.123456-abc
      #                                Get this from GoogleService-Info.plist (REVERSED_CLIENT_ID).
      #   GOOGLE_SERVICE_INFO_PLIST  → entire contents of GoogleService-Info.plist
      #                                (paste the whole XML — Codemagic stores it as a string).
      groups:
        - traverse-secrets
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.youngapps.traverse
      vars:
        BUNDLE_ID: com.youngapps.traverse

    scripts:
      - name: Install npm dependencies
        # Use install (not ci) so newly-added native plugin packages
        # don't fail when the lockfile hasn't been regenerated yet.
        script: npm install

      - name: Write .env file
        script: |
          echo "VITE_FIREBASE_API_KEY=$VITE_FIREBASE_API_KEY" > .env
          echo "VITE_FIREBASE_AUTH_DOMAIN=$VITE_FIREBASE_AUTH_DOMAIN" >> .env
          echo "VITE_FIREBASE_PROJECT_ID=$VITE_FIREBASE_PROJECT_ID" >> .env
          echo "VITE_FIREBASE_STORAGE_BUCKET=$VITE_FIREBASE_STORAGE_BUCKET" >> .env
          echo "VITE_FIREBASE_MESSAGING_SENDER_ID=$VITE_FIREBASE_MESSAGING_SENDER_ID" >> .env
          echo "VITE_FIREBASE_APP_ID=$VITE_FIREBASE_APP_ID" >> .env
          echo "VITE_MAPBOX_TOKEN=$VITE_MAPBOX_TOKEN" >> .env
          echo "VITE_GOOGLE_PLACES_KEY=$VITE_GOOGLE_PLACES_KEY" >> .env

      - name: Build web app
        script: npm run build

      - name: Add iOS platform (Codemagic has CocoaPods — skips local requirement)
        # This creates the ios/ Xcode project on the build machine.
        # We run it every build since ios/ is not committed to git.
        script: npx cap add ios

      - name: Generate iOS app icons
        # Generates all required icon sizes from resources/icon.png (1024x1024).
        script: npx @capacitor/assets generate --ios

      - name: Add Sign in with Apple entitlement
        # The Apple Sign-In entitlement must be present in the binary.
        # Without it the OS hard-crashes the app on launch.
        # We write the entitlements file here; Codemagic's use-profiles step
        # merges it with the provisioning profile entitlements automatically.
        script: |
          ENTITLEMENTS=ios/App/App/App.entitlements
          if [ ! -f "$ENTITLEMENTS" ]; then
            cat > "$ENTITLEMENTS" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict/>
          </plist>
          PLIST
          fi
          /usr/libexec/PlistBuddy -c "Add :com.apple.developer.applesignin array" "$ENTITLEMENTS" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :com.apple.developer.applesignin:0 string Default" "$ENTITLEMENTS" 2>/dev/null || true
          echo "Entitlements file:"
          cat "$ENTITLEMENTS"
          # Wire the entitlements file into the Xcode project build settings.
          # cap add ios may not set CODE_SIGN_ENTITLEMENTS, so without this
          # step the file exists on disk but Xcode never signs it into the binary.
          ruby - <<'RUBY'
          require 'xcodeproj'
          proj = Xcodeproj::Project.open('ios/App/App.xcodeproj')
          proj.targets.find { |t| t.name == 'App' }&.build_configurations&.each do |config|
            config.build_settings['CODE_SIGN_ENTITLEMENTS'] = 'App/App.entitlements'
          end
          proj.save
          puts 'Set CODE_SIGN_ENTITLEMENTS = App/App.entitlements'
          RUBY

      - name: Sync web assets into iOS project
        # cap sync also runs `pod install` to pull in native plugin pods
        # (FirebaseAuthentication, GoogleSignIn, etc.).
        script: npx cap sync ios

      - name: Enable Google Sign-In via post_install hook
        # The plugin gates ALL Google code in `#if RGCFA_INCLUDE_GOOGLE`. Without
        # the flag the signIn method body is empty — no UI, no callback, just a
        # silent return that surfaces as the JS-side 30-second timeout.
        #
        # We keep the plugin on its default Lite subspec (Capacitor's @objc
        # plugin registration works there — Apple Sign-In is the proof) and:
        #   1. Add GoogleSignIn 7.1.0 pod to the App target
        #   2. MERGE flag-injection logic into Capacitor's existing
        #      post_install block (defining a second post_install would
        #      override Capacitor's, breaking deployment-target enforcement)
        #   3. Verify after pod install that the flag actually landed in the
        #      generated Pods xcconfig — fail the build if it didn't.
        script: |
          set -e   # fail step immediately if Ruby patch script errors
          cd ios/App
          ruby - <<'RUBY'
          path = 'Podfile'
          content = File.read(path)

          # 1. Add GoogleSignIn pod to App target
          unless content.include?("pod 'GoogleSignIn'")
            content = content.sub(
              /(target 'App' do\s*\n\s*capacitor_pods)/,
              "\\1\n  pod 'GoogleSignIn', '7.1.0'"
            )
            abort "Could not find 'target App do' block to add GoogleSignIn pod" \
              unless content.include?("pod 'GoogleSignIn'")
            puts "Added GoogleSignIn pod"
          end

          # 2. Inject our flag-setting logic INTO the existing post_install block
          # NOTE: <<~'LOGIC' (single-quoted delimiter) DISABLES Ruby string
          # interpolation. We need this so #{flags} stays as literal text in
          # the generated Podfile post_install block, NOT evaluated here.
          flag_logic = <<~'LOGIC'
            installer.pods_project.targets.each do |t|
              if t.name == 'CapacitorFirebaseAuthentication'
                t.build_configurations.each do |c|
                  flags = c.build_settings['OTHER_SWIFT_FLAGS'] || '$(inherited)'
                  unless flags.include?('-DRGCFA_INCLUDE_GOOGLE')
                    c.build_settings['OTHER_SWIFT_FLAGS'] = "#{flags} -DRGCFA_INCLUDE_GOOGLE"
                  end
                end
                puts "[post_install] applied -DRGCFA_INCLUDE_GOOGLE"
              end
            end
          LOGIC

          unless content.include?('RGCFA_INCLUDE_GOOGLE')
            if content =~ /post_install do \|installer\|/
              # Inject right after the opening line of the existing block
              content.sub!(
                /(post_install do \|installer\|\s*\n)/,
                "\\1#{flag_logic.lines.map { |l| "  #{l}" }.join}"
              )
              puts "Merged flag logic into existing post_install"
            else
              content += "\npost_install do |installer|\n#{flag_logic}end\n"
              puts "Created new post_install block"
            end
          end

          File.write(path, content)
          RUBY
          echo "----- Podfile after patch -----"
          cat Podfile
          echo "-------------------------------"
          pod install
          echo ""
          echo "===== VERIFY: -DRGCFA_INCLUDE_GOOGLE in plugin xcconfig ====="
          XCCONFIG_DIR="Pods/Target Support Files/CapacitorFirebaseAuthentication"
          if grep -r "RGCFA_INCLUDE_GOOGLE" "$XCCONFIG_DIR" 2>/dev/null; then
            echo "✅ Flag is present in the generated xcconfig"
          else
            echo "❌ Flag MISSING — Google Sign-In will not work"
            echo "Contents of $XCCONFIG_DIR:"
            ls -la "$XCCONFIG_DIR" 2>/dev/null || echo "(directory not found)"
            echo ""
            echo "OTHER_SWIFT_FLAGS in xcconfig files:"
            grep -h "OTHER_SWIFT_FLAGS" "$XCCONFIG_DIR"/*.xcconfig 2>/dev/null
            exit 1
          fi

      - name: Write GoogleService-Info.plist
        # Native Firebase iOS SDK calls [FIRApp configure] on launch and
        # hard-crashes if GoogleService-Info.plist is absent from the app
        # bundle. Writing the file to disk is not enough — it must also be
        # registered in Xcode's Copy Bundle Resources build phase so that
        # Xcode actually copies it into the .ipa. We use the xcodeproj gem
        # (ships with CocoaPods on every Codemagic macOS runner) to add the
        # reference programmatically after cap add ios creates the project.
        script: |
          if [ -n "$GOOGLE_SERVICE_INFO_PLIST" ]; then
            printf '%s' "$GOOGLE_SERVICE_INFO_PLIST" > ios/App/App/GoogleService-Info.plist
            echo "Wrote GoogleService-Info.plist ($(wc -c < ios/App/App/GoogleService-Info.plist) bytes)"
            ruby - <<'RUBY'
          require 'xcodeproj'
          proj = Xcodeproj::Project.open('ios/App/App.xcodeproj')
          target = proj.targets.find { |t| t.name == 'App' }
          group = proj.main_group.find_subpath('App', false)
          if group.files.any? { |f| f.path == 'GoogleService-Info.plist' }
            puts 'GoogleService-Info.plist already in project'
          else
            ref = group.new_reference('GoogleService-Info.plist')
            target.add_resources([ref])
            proj.save
            puts 'Added GoogleService-Info.plist to Copy Bundle Resources'
          end
          RUBY
          else
            echo "WARNING: GOOGLE_SERVICE_INFO_PLIST env var is empty — Firebase will crash at launch"
          fi

      - name: Add Google Sign-In URL scheme + GIDClientID to Info.plist
        # The iOS Google Sign-In SDK needs TWO things in Info.plist:
        #   1. CFBundleURLTypes with the REVERSED_CLIENT_ID  → handles OAuth callback
        #   2. GIDClientID with the regular CLIENT_ID         → tells the SDK which
        #      OAuth client to authenticate against. Without this, GIDSignIn.signIn()
        #      can hang forever with no UI presented.
        # We read CLIENT_ID directly from GoogleService-Info.plist so there's
        # no second env var to keep in sync.
        script: |
          PLIST=ios/App/App/Info.plist
          GSI=ios/App/App/GoogleService-Info.plist
          if [ -z "$GOOGLE_REVERSED_CLIENT_ID" ]; then
            echo "WARNING: GOOGLE_REVERSED_CLIENT_ID env var is empty — Google Sign-In will fail"
          else
            /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" "$PLIST" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0 dict" "$PLIST"
            /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" "$PLIST"
            /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string $GOOGLE_REVERSED_CLIENT_ID" "$PLIST"
            echo "Added URL scheme: $GOOGLE_REVERSED_CLIENT_ID"
          fi
          if [ -f "$GSI" ]; then
            CLIENT_ID=$(/usr/libexec/PlistBuddy -c "Print :CLIENT_ID" "$GSI" 2>/dev/null || echo "")
            if [ -n "$CLIENT_ID" ]; then
              /usr/libexec/PlistBuddy -c "Add :GIDClientID string $CLIENT_ID" "$PLIST" 2>/dev/null \
                || /usr/libexec/PlistBuddy -c "Set :GIDClientID $CLIENT_ID" "$PLIST"
              echo "Set GIDClientID = $CLIENT_ID"
            else
              echo "WARNING: Could not read CLIENT_ID from GoogleService-Info.plist"
            fi
          fi

      - name: Diagnose Google Sign-In setup
        # Prints the bits that determine whether Google Sign-In can present
        # its UI on iOS. Run a build, then read the Codemagic log for this
        # step to verify each value is what we expect.
        script: |
          echo "===== GoogleService-Info.plist (source of truth) ====="
          /usr/libexec/PlistBuddy -c "Print :CLIENT_ID"          ios/App/App/GoogleService-Info.plist
          /usr/libexec/PlistBuddy -c "Print :REVERSED_CLIENT_ID" ios/App/App/GoogleService-Info.plist
          /usr/libexec/PlistBuddy -c "Print :BUNDLE_ID"          ios/App/App/GoogleService-Info.plist
          echo ""
          echo "===== Info.plist (must contain GIDClientID + URL scheme) ====="
          /usr/libexec/PlistBuddy -c "Print :GIDClientID"        ios/App/App/Info.plist 2>/dev/null \
            || echo "MISSING: GIDClientID"
          /usr/libexec/PlistBuddy -c "Print :CFBundleURLTypes"   ios/App/App/Info.plist 2>/dev/null \
            || echo "MISSING: CFBundleURLTypes"
          echo ""
          echo "===== Installed pod versions ====="
          if [ -f ios/App/Podfile.lock ]; then
            grep -E "^\s+- (GoogleSignIn|FirebaseAuth|CapacitorFirebaseAuthentication)" ios/App/Podfile.lock | sort -u
          else
            echo "Podfile.lock missing"
          fi

      - name: Set export compliance flag
        # Declares the app uses only exempt encryption (HTTPS/standard
        # iOS crypto). Skips the App Store Connect compliance prompt.
        script: |
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" ios/App/App/Info.plist

      - name: Bump build number
        # App Store Connect rejects duplicate build numbers. Use Codemagic's
        # auto-incrementing $BUILD_NUMBER plus a +10 offset to skip past
        # build 1 which was already uploaded.
        script: |
          cd ios/App
          agvtool new-version -all $(($BUILD_NUMBER + 10))

      - name: Set up code signing
        # Installs the certificate + provisioning profile you uploaded in
        # Codemagic dashboard → Teams → Code signing → iOS
        script: xcode-project use-profiles

      - name: Build .ipa
        script: |
          xcode-project build-ipa \
            --workspace ios/App/App.xcworkspace \
            --scheme App

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        # Uses API key stored as env vars — no "integration" needed in the dashboard.
        # Add these three to your traverse-secrets group in Codemagic:
        #   APP_STORE_CONNECT_KEY_IDENTIFIER  → Key ID  (e.g. AB12CD34EF)
        #   APP_STORE_CONNECT_ISSUER_ID       → Issuer ID (UUID from App Store Connect)
        #   APP_STORE_CONNECT_PRIVATE_KEY     → Contents of the .p8 file (the whole text)
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
