workflows:
  ios-app-store:
    name: iOS App Store
    max_build_duration: 60
    environment:
      xcode: latest
      node: v20
      # --- Secrets group ---
      # Create a group called "traverse-secrets" in Codemagic dashboard:
      # Teams → Environment variables → Create group
      # Add every key from .env.example, plus the three App Store Connect keys below.
      #
      # New keys required for native auth:
      #   GOOGLE_REVERSED_CLIENT_ID  → e.g. com.googleusercontent.apps.123456-abc
      #                                Get this from GoogleService-Info.plist (REVERSED_CLIENT_ID).
      #   GOOGLE_SERVICE_INFO_PLIST  → entire contents of GoogleService-Info.plist
      #                                (paste the whole XML — Codemagic stores it as a string).
      groups:
        - traverse-secrets
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.youngapps.traverse
      vars:
        BUNDLE_ID: com.youngapps.traverse

    scripts:
      - name: Install npm dependencies
        # Use install (not ci) so newly-added native plugin packages
        # don't fail when the lockfile hasn't been regenerated yet.
        script: npm install

      - name: Write .env file
        script: |
          echo "VITE_FIREBASE_API_KEY=$VITE_FIREBASE_API_KEY" > .env
          echo "VITE_FIREBASE_AUTH_DOMAIN=$VITE_FIREBASE_AUTH_DOMAIN" >> .env
          echo "VITE_FIREBASE_PROJECT_ID=$VITE_FIREBASE_PROJECT_ID" >> .env
          echo "VITE_FIREBASE_STORAGE_BUCKET=$VITE_FIREBASE_STORAGE_BUCKET" >> .env
          echo "VITE_FIREBASE_MESSAGING_SENDER_ID=$VITE_FIREBASE_MESSAGING_SENDER_ID" >> .env
          echo "VITE_FIREBASE_APP_ID=$VITE_FIREBASE_APP_ID" >> .env
          echo "VITE_MAPBOX_TOKEN=$VITE_MAPBOX_TOKEN" >> .env
          echo "VITE_GOOGLE_PLACES_KEY=$VITE_GOOGLE_PLACES_KEY" >> .env

      - name: Build web app
        script: npm run build

      - name: Add iOS platform (Codemagic has CocoaPods — skips local requirement)
        # This creates the ios/ Xcode project on the build machine.
        # We run it every build since ios/ is not committed to git.
        script: npx cap add ios

      - name: Sync web assets into iOS project
        # cap sync also runs `pod install` to pull in native plugin pods
        # (FirebaseAuthentication, GoogleSignIn, etc.).
        script: npx cap sync ios

      - name: Write GoogleService-Info.plist
        # Native Google Sign-In needs this file alongside the app binary.
        # Source the contents from a Codemagic env var so the file isn't
        # committed to git.
        script: |
          if [ -n "$GOOGLE_SERVICE_INFO_PLIST" ]; then
            printf '%s' "$GOOGLE_SERVICE_INFO_PLIST" > ios/App/App/GoogleService-Info.plist
            echo "Wrote GoogleService-Info.plist ($(wc -c < ios/App/App/GoogleService-Info.plist) bytes)"
          else
            echo "WARNING: GOOGLE_SERVICE_INFO_PLIST env var is empty — Google Sign-In will fail at runtime"
          fi

      - name: Add Google Sign-In URL scheme to Info.plist
        # The iOS Google Sign-In SDK validates the OAuth callback against a
        # URL scheme registered in Info.plist. Without it, the sign-in flow
        # never returns to the app.
        script: |
          PLIST=ios/App/App/Info.plist
          if [ -z "$GOOGLE_REVERSED_CLIENT_ID" ]; then
            echo "WARNING: GOOGLE_REVERSED_CLIENT_ID env var is empty — Google Sign-In will fail"
          else
            /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" "$PLIST" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0 dict" "$PLIST"
            /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" "$PLIST"
            /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string $GOOGLE_REVERSED_CLIENT_ID" "$PLIST"
            echo "Added URL scheme: $GOOGLE_REVERSED_CLIENT_ID"
          fi

      - name: Enable Safari Web Inspector on iOS 16.4+
        # TestFlight builds normally block Safari Web Inspector. iOS 16.4+
        # exposes WKWebView.isInspectable as an explicit opt-in. Patch
        # AppDelegate.swift to flip it on so future TestFlight crashes can
        # be inspected from a Mac.
        script: |
          DELEGATE=ios/App/App/AppDelegate.swift
          if ! grep -q "isInspectable" "$DELEGATE"; then
            python3 <<'PYEOF'
          path = "ios/App/App/AppDelegate.swift"
          with open(path, "r") as f:
              content = f.read()
          patch = """
                  // Enable Safari Web Inspector for TestFlight debugging (iOS 16.4+).
                  if #available(iOS 16.4, *) {
                      if let bridgeVC = self.window?.rootViewController as? CAPBridgeViewController {
                          bridgeVC.webView?.isInspectable = true
                      }
                  }
          """
          # Insert before the first 'return true' inside didFinishLaunchingWithOptions.
          marker = "return true"
          idx = content.find(marker)
          if idx != -1:
              content = content[:idx] + patch + "\n        " + content[idx:]
              with open(path, "w") as f:
                  f.write(content)
              print("Patched AppDelegate.swift with isInspectable")
          else:
              print("Could not locate insertion point in AppDelegate.swift")
          PYEOF
          else
            echo "AppDelegate.swift already patched"
          fi

      - name: Set export compliance flag
        # Declares the app uses only exempt encryption (HTTPS/standard
        # iOS crypto). Skips the App Store Connect compliance prompt.
        script: |
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" ios/App/App/Info.plist

      - name: Bump build number
        # App Store Connect rejects duplicate build numbers. Use Codemagic's
        # auto-incrementing $BUILD_NUMBER plus a +10 offset to skip past
        # build 1 which was already uploaded.
        script: |
          cd ios/App
          agvtool new-version -all $(($BUILD_NUMBER + 10))

      - name: Set up code signing
        # Installs the certificate + provisioning profile you uploaded in
        # Codemagic dashboard → Teams → Code signing → iOS
        script: xcode-project use-profiles

      - name: Build .ipa
        script: |
          xcode-project build-ipa \
            --workspace ios/App/App.xcworkspace \
            --scheme App

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        # Uses API key stored as env vars — no "integration" needed in the dashboard.
        # Add these three to your traverse-secrets group in Codemagic:
        #   APP_STORE_CONNECT_KEY_IDENTIFIER  → Key ID  (e.g. AB12CD34EF)
        #   APP_STORE_CONNECT_ISSUER_ID       → Issuer ID (UUID from App Store Connect)
        #   APP_STORE_CONNECT_PRIVATE_KEY     → Contents of the .p8 file (the whole text)
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
